<ui-select-field
  class="w-full"
  [placeholder]="placeholder()"
  filterPlaceholder="Type a terminal code or name"
  optionLabel="label"
  optionValue="id"
  [options]="options()"
  [filter]="true"
  [showClear]="true"
  [loading]="loading()"
  [disabled]="disabled()"
  [value]="selectedId()"
  (valueChange)="onSelect($event)"
  (filterChange)="onFilterChange($event)"
  (touch)="touch.emit()"
>
  <ng-template #item let-option>
    <div class="flex flex-col">
      <div class="font-medium">{{ option.terminal.code }} - {{ option.terminal.name }}</div>
      <div class="text-muted-foreground text-xs">{{ option.terminal.countryCode }}</div>
    </div>
  </ng-template>

  <ng-template #selectedItem let-option>
    <span class="font-medium">{{ option.terminal.code }} - {{ option.terminal.name }}</span>
  </ng-template>
</ui-select-field>
