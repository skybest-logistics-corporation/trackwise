<ui-dialog header="New Charge Code" [(open)]="open" [modal]="true" width="30rem">
  <div class="flex flex-col gap-4">
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
      <ui-form-field label="Code" for="newCode" [required]="true" class="sm:col-span-1">
        <ui-text-field id="newCode" [formField]="form.code" [maxlength]="20" />
      </ui-form-field>
      <ui-form-field label="Name" for="newName" [required]="true" class="sm:col-span-2">
        <ui-text-field id="newName" [formField]="form.name" placeholder="Container Detention" />
      </ui-form-field>
    </div>

    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
      <ui-form-field label="Category" for="newCategory" [required]="true">
        <ui-select-field
          id="newCategory"
          [formField]="form.category"
          [options]="categoryOptions"
          optionLabel="label"
          optionValue="value"
        />
      </ui-form-field>
      <ui-form-field label="Default Unit" for="newUnit" [required]="true">
        <ui-text-field id="newUnit" [formField]="form.defaultUnit" placeholder="per day" />
      </ui-form-field>
    </div>

    <ui-form-field label="Applicable Modes" for="newModes" [required]="true">
      <ui-multiselect-field
        id="newModes"
        [formField]="form.applicableModes"
        [options]="modeOptions"
        optionLabel="label"
        optionValue="value"
        placeholder="Select freight modes"
      />
    </ui-form-field>
  </div>

  <ng-template #footer>
    <ui-button appearance="text" label="Cancel" [disabled]="isBusy()" (click)="open.set(false)" />
    <ui-button
      intent="primary"
      icon="plus"
      label="Create"
      [disabled]="!form().valid() || isBusy()"
      (click)="submit()"
    />
  </ng-template>
</ui-dialog>
